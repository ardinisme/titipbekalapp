  const renderPengaturanTab = () => {
    const simpanPengaturanGlobal = (e) => {
      e.preventDefault();
      const cleanDev = editDeviceName.trim().toUpperCase() || deviceId;
      if (cleanDev !== deviceId) {
        setDeviceId(cleanDev);
        LS.set(KEYS.DEVICE, cleanDev);
      }
      enqueueCommand('SET_SAVE', {
        hargaJual: Number(formSet.hargaJual) || 0,
        komisi: Number(formSet.komisi) || 0,
        bizInfo: formSet.bizInfo,
        harianBgColor: formSet.harianBgColor,
        harianTextColor: formSet.harianTextColor,
        kategoriList: formSet.kategoriList
      });
      notify('Pengaturan global disimpan & dikirim ke Cloud');
    };

    const handleLogoUpload = (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        setLocalLogo(ev.target.result);
        LS.set(KEYS.LOGO, ev.target.result);
        notify('Logo lokal diperbarui');
      };
      reader.readAsDataURL(file);
    };

    const addKategori = () => {
      const nm = newCat.trim();
      if (!nm) return;
      if (formSet.kategoriList.includes(nm)) return notify('Kategori sudah ada', 'err');
      const nextCats = [...formSet.kategoriList, nm];
      setFormSet(prev => ({ ...prev, kategoriList: nextCats }));
      enqueueCommand('SET_SAVE', { kategoriList: nextCats });
      setNewCat('');
      notify('Kategori ditambahkan & disinkronkan');
    };

    const hapusKategori = (kat) => {
      if (db.mnu.some(m => m[3] === kat)) return notify('Kategori masih digunakan pada menu', 'err');
      const nextCats = formSet.kategoriList.filter(k => k !== kat);
      setFormSet(prev => ({ ...prev, kategoriList: nextCats }));
      enqueueCommand('SET_SAVE', { kategoriList: nextCats });
      notify('Kategori dihapus');
    };

    return html`
      <div class="anim-up card" style=${{ padding: 18, display: 'flex', flexDirection: 'column', gap: 20 }}>
        <form onSubmit=${simpanPengaturanGlobal} style=${{ display: 'flex', flexDirection: 'column', gap: 16 }}>

                <input type="number" class="input-field" value=${formSet.hargaJual} onInput=${e => setFormSet({ ...formSet, hargaJual: Number(e.target.value) })} />
              </div>
              <div>
                <label style=${{ fontSize: 12, fontWeight: 600, color: 'var(--muted)', display: 'block', marginBottom: 4 }}>Komisi Lapak / Pcs (Rp)</label>
                <input type="number" class="input-field" value=${formSet.komisi} onInput=${e => setFormSet({ ...formSet, komisi: Number(e.target.value) })} />
              </div>
            </div>
          </div>

          <div style=${{ borderTop: '1px solid var(--border)', paddingTop: 14 }}>
            <h3 style=${{ fontSize: 15, fontWeight: 700, margin: '0 0 10px 0' }}>Identitas Usaha (Kop Struk & Laporan)</h3>
            <div style=${{ display: 'flex', flexDirection: 'column', gap: 10 }}>
              <input type="text" class="input-field" placeholder="Nama Usaha" value=${formSet.bizInfo.nama} onInput=${e => setFormSet({ ...formSet, bizInfo: { ...formSet.bizInfo, nama: e.target.value } })} />
              <textarea class="input-field" rows="2" placeholder="Alamat Usaha" value=${formSet.bizInfo.alamat} onInput=${e => setFormSet({ ...formSet, bizInfo: { ...formSet.bizInfo, alamat: e.target.value } })} />
              <div style=${{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 10 }}>
                <input type="text" class="input-field" placeholder="No. Telp / WA" value=${formSet.bizInfo.telp} onInput=${e => setFormSet({ ...formSet, bizInfo: { ...formSet.bizInfo, telp: e.target.value } })} />
                <input type="text" class="input-field" placeholder="Sosmed (IG/FB)" value=${formSet.bizInfo.sosmed} onInput=${e => setFormSet({ ...formSet, bizInfo: { ...formSet.bizInfo, sosmed: e.target.value } })} />
              </div>
              <div>
                <label style=${{ fontSize: 12, fontWeight: 600, color: 'var(--muted)', display: 'block', marginBottom: 4 }}>Logo Usaha (Disimpan Lokal di Perangkat Ini)</label>
                <div style=${{ display: 'flex', gap: 8, alignItems: 'center' }}>
                  ${localLogo && html`<img src=${localLogo} style=${{ height: 38, width: 38, objectFit: 'contain', borderRadius: 4, border: '1px solid var(--border)' }} />`}
                  <input type="file" accept="image/*" class="input-field" onChange=${handleLogoUpload} style=${{ flex: 1 }} />
                  ${localLogo && html`<button type="button" class="btn-ghost" style=${{ color: 'var(--expense)', padding: 6 }} onClick=${() => { setLocalLogo(''); LS.set(KEYS.LOGO, ''); }}><${I.Trash} style=${{ width: 15, height: 15 }} /></button>`}
                </div>
              </div>
            </div>
          </div>

          <div style=${{ borderTop: '1px solid var(--border)', paddingTop: 14 }}>
            <label style=${{ fontSize: 12, fontWeight: 600, color: 'var(--muted)', display: 'block', marginBottom: 4 }}>Kode Identitas Perangkat HP Ini</label>
            <input type="text" class="input-field" placeholder="Contoh: HP-KASIR / HP-1" value=${editDeviceName} onInput=${e => setEditDeviceName(e.target.value)} />
          </div>

          <button type="submit" class="btn-primary" style=${{ width: '100%' }}>Simpan Pengaturan Global</button>
        </form>

        <!-- Kategori Menu -->
        <div style=${{ borderTop: '1px solid var(--border)', paddingTop: 16 }}>
          <h3 style=${{ fontSize: 15, fontWeight: 700, margin: '0 0 10px 0' }}>Kategori Menu (Urutan Teks Canva)</h3>
          <div style=${{ display: 'flex', flexDirection: 'column', gap: 6, marginBottom: 10 }}>
            ${formSet.kategoriList.map(kat => html`
              <div key=${kat} style=${{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', padding: '6px 0', borderBottom: '1px solid var(--border)' }}>
                <span style=${{ fontSize: 13, fontWeight: 600 }}>${kat}</span>
                <button class="btn-ghost" style=${{ padding: 4, border: 'none', color: 'var(--expense)' }} onClick=${() => hapusKategori(kat)}><${I.Trash} style=${{ width: 15, height: 15 }} /></button>
              </div>
            `)}
          </div>
          <div style=${{ display: 'flex', gap: 8 }}>
            <input type="text" class="input-field" placeholder="Nama kategori baru..." value=${newCat} onInput=${e => setNewCat(e.target.value)} />
            <button type="button" class="btn-primary" onClick=${addKategori}>Tambah</button>
          </div>
        </div>

        <!-- Koneksi Cloud 7-Sheet -->
        <div style=${{ borderTop: '1px solid var(--border)', paddingTop: 16 }}>
          <div style=${{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 8 }}>
            <h3 style=${{ fontSize: 15, fontWeight: 700, margin: 0, display: 'flex', alignItems: 'center', gap: 6 }}>
              <${I.Cloud} style=${{ width: 17, height: 17 }} /> Koneksi Cloud (7-Sheet v3.0)
            </h3>
            <span style=${{ fontSize: 11, color: 'var(--muted)' }}>Versi DB: <b>v${db.v}</b></span>
          </div>

          ${outbox.length > 0 && html`
            <div style=${{ fontSize: 12, color: 'var(--warn)', fontWeight: 600, marginBottom: 8 }}>
              ${outbox.length} perintah lokal menunggu dikirim ke Cloud.
            </div>
          `}

          <input
            type="url"
            class="input-field"
            placeholder="Tempel URL Web App Google Apps Script (https://script.google.com/macros/s/...)"
            value=${syncUrl}
            onInput=${e => { setSyncUrl(e.target.value); LS.set(KEYS.SYNC_URL, e.target.value); }}
            style=${{ marginBottom: 10 }}
          />
          <div style=${{ display: 'flex', gap: 8, flexWrap: 'wrap' }}>
            <button type="button" class="btn-primary" onClick=${() => syncWithServer({ manual: true })}>Sync Sekarang</button>
            <button type="button" class="btn-ghost" onClick=${() => {
              const resetC = { ...serverCache, v: 0 };
              cacheRef.current = resetC;
              setServerCache(resetC);
              LS.set(KEYS.CACHE, resetC);
              syncWithServer({ manual: true });
            }}>Tarik Ulang Snapshot Server</button>
            ${hasLegacyV2Data && html`
              <button type="button" class="btn-ghost" style=${{ color: 'var(--info)' }} onClick=${migrateFromV2}>Migrasi Data v2.1</button>
            `}
          </div>
        </div>
      </div>
    `;
  };

  /* ==========================================================================
   * BADGE STATUS SINKRONISASI HEADER
   * ========================================================================== */
  const renderSyncBadge = () => {
    if (!syncUrl) {
      return html`<span class="badge" style=${{ background: 'var(--expense)', color: '#fff', fontSize: 10 }}>Offline / Lokal</span>`;
    }
    if (syncState === 'syncing') {
      return html`<span class="badge" style=${{ background: 'var(--info)', color: '#fff', fontSize: 10 }}>Syncing...</span>`;
    }
    if (syncState === 'err') {
      return html`<button onClick=${() => syncWithServer({ manual: true })} class="badge" style=${{ background: 'var(--expense)', color: '#fff', fontSize: 10, border: 'none', cursor: 'pointer' }}>Gagal • Coba Lagi</button>`;
    }
    return html`<button onClick=${() => syncWithServer({ manual: true })} class="badge" style=${{ background: 'var(--success)', color: '#fff', fontSize: 10, border: 'none', cursor: 'pointer' }} title="Klik untuk sinkronisasi manual">Cloud v${db.v}${outbox.length > 0 ? ` (${outbox.length})` : ''}</button>`;
  };

  /* ==========================================================================
   * DATA MODAL RINCIAN & AMBIL & TITIP
   * ========================================================================== */
  const activeRincianTrx = useMemo(() => {
    if (!rincianTrxId) return null;
    return db.trx.find(t => t[0] === rincianTrxId) || activeDayTransactions.find(t => t[0] === rincianTrxId) || null;
  }, [rincianTrxId, db.trx, activeDayTransactions]);

  const activeAmbilTrx = useMemo(() => {
    if (!ambilTrxId) return null;
    return db.trx.find(t => t[0] === ambilTrxId) || null;
  }, [ambilTrxId, db.trx]);

  const filteredTitipSuppliers = useMemo(() => {
    const q = titipSupSearch.toLowerCase().trim();
    if (!q) return db.sup;
    return db.sup.filter(s => s[1].toLowerCase().includes(q) || (s[2] || '').includes(q));
  }, [db.sup, titipSupSearch]);

  const menusForSelectedTitipSup = useMemo(() => {
    if (!titipSup) return [];
    return db.mnu.filter(m => m[1] === titipSup);
  }, [db.mnu, titipSup]);

  const filteredHarianMenus = useMemo(() => {
    const q = harianSearch.toLowerCase().trim();
    if (!q) return db.mnu;
    return db.mnu.filter(m => m[2].toLowerCase().includes(q) || getSupplierName(m[1]).toLowerCase().includes(q) || (m[3] || '').toLowerCase().includes(q));
  }, [db.mnu, harianSearch, getSupplierName]);

  return html`
    <div>
      <div class="no-print" style=${{ minHeight: '100vh', display: 'flex', flexDirection: 'column' }}>
        <header style=${{ background: 'var(--card)', borderBottom: '1px solid var(--border)', position: 'sticky', top: 0, zIndex: 30, padding: '10px 16px' }}>
          <div style=${{ maxWidth: 620, margin: '0 auto', display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 8 }}>
            <div style=${{ display: 'flex', alignItems: 'center', gap: 7, flexWrap: 'wrap' }}>
              <div style=${{ background: 'var(--accent)', color: '#fff', width: 28, height: 28, borderRadius: 7, display: 'flex', alignItems: 'center', justifyContent: 'center', fontWeight: 700 }}>T</div>
              <span style=${{ fontSize: 17, fontWeight: 700, letterSpacing: '-0.4px' }}>TitipBekal</span>
              ${renderSyncBadge()}
            </div>
            <div style=${{ display: 'flex', alignItems: 'center', gap: 6 }}>
              <span style=${{ fontSize: 11, color: 'var(--muted)', fontFamily: 'DM Mono, monospace' }}>${deviceId}</span>
              <button onClick=${() => setDark(!dark)} class="btn-ghost" style=${{ padding: 7, border: 'none' }}>
                ${dark ? html`<${I.Sun} style=${{ width: 17, height: 17 }} />` : html`<${I.Moon} style=${{ width: 17, height: 17 }} />`}
              </button>
            </div>
          </div>
        </header>

        <main style=${{ flex: 1, maxWidth: 620, margin: '0 auto', width: '100%', padding: '16px' }}>
          <div class="tab-bar" style=${{ marginBottom: 16 }}>
            <button class=${`tab-btn ${activeTab === 'transaksi' ? 'active' : ''}`} onClick=${() => setActiveTab('transaksi')}>Transaksi</button>
            <button class=${`tab-btn ${activeTab === 'penjualan' ? 'active' : ''}`} onClick=${() => setActiveTab('penjualan')}>Penjualan</button>
            <button class=${`tab-btn ${activeTab === 'master' ? 'active' : ''}`} onClick=${() => setActiveTab('master')}>Master Data</button>
            <button class=${`tab-btn ${activeTab === 'pengaturan' ? 'active' : ''}`} onClick=${() => setActiveTab('pengaturan')}><${I.Settings} style=${{ width: 16, height: 16 }} /></button>
          </div>

          ${activeTab === 'transaksi' && renderTransaksiTab()}
          ${activeTab === 'penjualan' && html`<${KasirLokal} menus=${db.mnu} defaultHarga=${db.set.hargaJual} notify=${notify} executePrint=${executePrint} />`}
          ${activeTab === 'master' && renderMasterTab()}
          ${activeTab === 'pengaturan' && renderPengaturanTab()}
        </main>

        <!-- ================================================================
             MODAL 1: SUPPLIER (TAMBAH / EDIT)
             ================================================================ -->
        ${modal === 'supplier' && html`
          <div class="modal-overlay" onClick=${e => e.target === e.currentTarget && setModal(null)}>
            <div class="modal-box anim-up">
              <div style=${{ padding: '14px 18px', borderBottom: '1px solid var(--border)', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                <h3 style=${{ fontSize: 16, fontWeight: 700, margin: 0 }}>${supplierMap.has(supForm.id) ? 'Edit Supplier' : 'Tambah Supplier'}</h3>
                <button class="btn-ghost" style=${{ padding: 4, border: 'none' }} onClick=${() => setModal(null)}><${I.X} style=${{ width: 19, height: 19 }} /></button>
              </div>
              <form onSubmit=${saveSupplier} style=${{ padding: 18, display: 'flex', flexDirection: 'column', gap: 11 }}>
                <input type="text" class="input-field" placeholder="Nama Supplier *" required value=${supForm.nama} onInput=${e => setSupForm(f => ({ ...f, nama: e.target.value }))} />
                <input type="text" class="input-field" placeholder="No. HP / WhatsApp (08... / 628...)" value=${supForm.hp} onInput=${e => setSupForm(f => ({ ...f, hp: e.target.value }))} />
                <div style=${{ display: 'grid', gridTemplateColumns: '1fr 2fr', gap: 10 }}>
                  <input type="text" class="input-field" placeholder="Bank / E-Wallet" value=${supForm.bank} onInput=${e => setSupForm(f => ({ ...f, bank: e.target.value }))} />
                  <input type="text" class="input-field" placeholder="Nomor Rekening" value=${supForm.rekening} onInput=${e => setSupForm(f => ({ ...f, rekening: e.target.value }))} />
                </div>
                <textarea class="input-field" rows="2" placeholder="Alamat (opsional)" value=${supForm.alamat} onInput=${e => setSupForm(f => ({ ...f, alamat: e.target.value }))} />
                <button type="submit" class="btn-primary" style=${{ marginTop: 4 }}>Simpan Supplier</button>
              </form>
            </div>
          </div>
        `}

        <!-- ================================================================
             MODAL 2: MENU (TAMBAH / EDIT + DETEKSI IDENTIK / MIRIP)
             ================================================================ -->
        ${modal === 'menu' && html`
          <div class="modal-overlay" onClick=${e => e.target === e.currentTarget && setModal(null)}>
            <div class="modal-box anim-up">
              <div style=${{ padding: '14px 18px', borderBottom: '1px solid var(--border)', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                <h3 style=${{ fontSize: 16, fontWeight: 700, margin: 0 }}>${menuMap.has(menuForm.id) ? 'Edit Menu' : 'Tambah Menu'}</h3>
                <button class="btn-ghost" style=${{ padding: 4, border: 'none' }} onClick=${() => setModal(null)}><${I.X} style=${{ width: 19, height: 19 }} /></button>
              </div>
              <form onSubmit=${saveMenu} style=${{ padding: 18, display: 'flex', flexDirection: 'column', gap: 11 }}>
                <select class="input-field" required value=${menuForm.supplierId} onChange=${e => setMenuForm(f => ({ ...f, supplierId: e.target.value }))}>
                  <option value="" disabled>Pilih Supplier...</option>
                  ${db.sup.map(s => html`<option value=${s[0]}>${s[1]}</option>`)}
                </select>
                <input type="text" class="input-field" placeholder="Nama Menu *" required value=${menuForm.nama} onInput=${e => setMenuForm(f => ({ ...f, nama: e.target.value }))} />

                ${similarMenus.length > 0 && html`
                  <div style=${{ padding: 11, borderRadius: 8, background: 'rgba(245, 158, 11, 0.12)', border: '1px solid var(--accent)', display: 'flex', flexDirection: 'column', gap: 6 }}>
                    <div style=${{ display: 'flex', alignItems: 'center', gap: 6, fontSize: 12, fontWeight: 700, color: 'var(--warn)' }}>
                      <${I.Alert} style=${{ width: 15, height: 15, flexShrink: 0 }} />
                      <span>Peringatan Menu Identik / Serupa:</span>
                    </div>
                    ${similarMenus.slice(0, 3).map(item => html`
                      <div key=${item.menu[0]} style=${{ fontSize: 12, paddingLeft: 21 }}>
                        <div>
                          <b>${item.menu[2]}</b> — ${item.sameSup
                            ? html`<span style=${{ color: 'var(--expense)', fontWeight: 700 }}>Mitra sama (${item.exact ? 'Identik 100%' : Math.round(item.score * 100) + '% mirip'})</span>`
                            : html`<span style=${{ color: 'var(--info)', fontWeight: 600 }}>Mitra: ${getSupplierName(item.menu[1])}</span>`}
                        </div>
                        ${!item.sameSup && menuForm.supplierId && html`
                          <button type="button" class="btn-ghost" style=${{ padding: '2px 8px', fontSize: 11, marginTop: 3 }} onClick=${() => setMenuForm(f => ({ ...f, nama: `${f.nama.trim()} (${getSupplierName(f.supplierId)})` }))}>
                            Tambah pembeda: "${menuForm.nama.trim()} (${getSupplierName(menuForm.supplierId)})"
                          </button>
                        `}
                      </div>
                    `)}
                  </div>
                `}

                <select class="input-field" required value=${menuForm.kategori} onChange=${e => setMenuForm(f => ({ ...f, kategori: e.target.value }))}>
                  <option value="" disabled>Pilih Kategori...</option>
                  ${db.set.kategoriList.map(k => html`<option value=${k}>${k}</option>`)}
                </select>
                <button type="submit" class="btn-primary" style=${{ marginTop: 4 }}>Simpan Menu</button>
              </form>
            </div>
          </div>
        `}

        <!-- ================================================================
             MODAL 3: BUAT / EDIT TITIPAN (PENCARIAN CEPAT SUPPLIER + MENU WRAP)
             ================================================================ -->
        ${modal === 'titip' && html`
          <div class="modal-overlay" onClick=${e => e.target === e.currentTarget && setModal(null)}>
            <div class="modal-box anim-up">
              <div style=${{ padding: '14px 18px', background: 'var(--accent)', color: '#fff', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                <h3 style=${{ fontSize: 16, fontWeight: 700, margin: 0 }}>${editingTitipId ? 'Edit Titipan' : 'Catat Titipan Baru'}</h3>
                <button class="btn-ghost" style=${{ padding: 4, border: 'none', color: '#fff' }} onClick=${() => setModal(null)}><${I.X} style=${{ width: 19, height: 19 }} /></button>
              </div>
              <div style=${{ padding: 18, display: 'flex', flexDirection: 'column', gap: 14 }}>
                ${!editingTitipId ? html`
                  <div>
                    <div style=${{ fontSize: 12, fontWeight: 700, color: 'var(--muted)', marginBottom: 6 }}>1. Cari & Pilih Supplier (${db.sup.length} mitra)</div>
                    <input type="text" class="input-field" style=${{ marginBottom: 8 }} placeholder="Ketik nama supplier..." value=${titipSupSearch} onInput=${e => setTitipSupSearch(e.target.value)} />
                    <div style=${{ display: 'flex', gap: 6, flexWrap: 'wrap', maxHeight: 115, overflowY: 'auto', padding: 2 }}>
                      ${filteredTitipSuppliers.slice(0, 15).map(s => html`
                        <button
                          type="button"
                          key=${s[0]}
                          class=${titipSup === s[0] ? 'btn-primary' : 'btn-ghost'}
                          style=${{ padding: '5px 10px', fontSize: 12 }}
                          onClick=${() => { setTitipSup(s[0]); setTitipItems({}); }}
                        >
                          ${s[1]}
                        </button>
                      `)}
                    </div>
                  </div>
                ` : html`
                  <div style=${{ padding: 10, borderRadius: 8, background: 'var(--paper2)', fontSize: 13 }}>
                    Supplier: <b>${getSupplierName(titipSup)}</b>
                  </div>
                `}

                ${titipSup && html`
                  <div style=${{ background: 'var(--paper2)', padding: 12, borderRadius: 10, border: '1px solid var(--border)', display: 'flex', flexDirection: 'column', gap: 10, maxHeight: '42vh', overflowY: 'auto' }}>
                    <div style=${{ fontSize: 12, fontWeight: 700, color: 'var(--muted)' }}>
                      2. Masukkan Qty Menu (${menusForSelectedTitipSup.length} menu tersedia)
                    </div>
                    ${menusForSelectedTitipSup.length === 0 ? html`
                      <div style=${{ fontSize: 12.5, color: 'var(--expense)' }}>Supplier ini belum memiliki daftar menu di Master Data.</div>
                    ` : menusForSelectedTitipSup.map(m => html`
                      <div key=${m[0]} style=${{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 10, borderBottom: '1px solid var(--border)', paddingBottom: 8 }}>
                        <div style=${{ flex: 1, minWidth: 0 }}>
                          <div style=${{ fontSize: 13.5, fontWeight: 600, wordBreak: 'break-word', lineHeight: 1.35 }}>${m[2]}</div>
                          <div style=${{ fontSize: 11, color: 'var(--muted)' }}>${m[3]}</div>
                        </div>
                        <input
                          type="number"
                          class="input-field"
                          style=${{ width: 76, padding: '6px 8px', textAlign: 'center', flexShrink: 0 }}
                          placeholder="0"
                          min="0"
                          value=${titipItems[m[0]] || ''}
                          onInput=${e => setTitipItems({ ...titipItems, [m[0]]: e.target.value })}
                        />
                      </div>
                    `)}
                  </div>

                  <div style=${{ display: 'grid', gridTemplateColumns: '1fr 1.4fr', gap: 8 }}>
                    <button type="button" class="btn-ghost" onClick=${() => saveTitip(false)}>Simpan Saja</button>
                    <button type="button" class="btn-primary" onClick=${() => saveTitip(true)}>
                      <${I.Printer} style=${{ width: 15, height: 15 }} /> Simpan & Cetak QR
                    </button>
                  </div>
                `}
              </div>
            </div>
          </div>
        `}

        <!-- ================================================================
             MODAL 4: PROSES AMBIL & KONFIRMASI PEMBAYARAN SUPPLIER
             ================================================================ -->
        ${modal === 'ambil' && activeAmbilTrx && (() => {
          const items = activeAmbilTrx[5] || [];
          const hj = Number(activeAmbilTrx[6]) || db.set.hargaJual;
          const km = Number(activeAmbilTrx[7]) || db.set.komisi;
          let previewLaku = 0;
          items.forEach(([mId, qty]) => {
            const s = Number(ambilSisa[mId]) || 0;
            previewLaku += Math.max(0, qty - s);
          });
          const previewBersih = Math.max(0, previewLaku * (hj - km));

          return html`
            <div class="modal-overlay" onClick=${e => e.target === e.currentTarget && setModal(null)}>
              <div class="modal-box anim-up">
                <div style=${{ padding: '14px 18px', background: 'var(--ink)', color: '#fff', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                  <h3 style=${{ fontSize: 16, fontWeight: 700, margin: 0 }}>Proses Ambil & Pembayaran</h3>
                  <button class="btn-ghost" style=${{ padding: 4, border: 'none', color: '#fff' }} onClick=${() => setModal(null)}><${I.X} style=${{ width: 19, height: 19 }} /></button>
                </div>
                <div style=${{ padding: 18, display: 'flex', flexDirection: 'column', gap: 14 }}>
                  <div style=${{ padding: 10, background: 'var(--paper2)', borderRadius: 8, fontSize: 13 }}>
                    <div><b>Supplier:</b> ${getSupplierName(activeAmbilTrx[2])}</div>
                    <div style=${{ fontSize: 11, color: 'var(--muted)' }}>Nota: ${activeAmbilTrx[0]} • Tanggal: ${activeAmbilTrx[1]}</div>
                  </div>

                  <div style=${{ background: 'var(--paper2)', padding: 11, borderRadius: 10, border: '1px solid var(--border)', display: 'flex', flexDirection: 'column', gap: 10, maxHeight: '36vh', overflowY: 'auto' }}>
                    ${items.map(([mId, qty]) => {
                      const sisaVal = Number(ambilSisa[mId]) || 0;
                      const lakuVal = Math.max(0, qty - sisaVal);
                      return html`
                        <div key=${mId} style=${{ display: 'flex', flexDirection: 'column', gap: 6, borderBottom: '1px solid var(--border)', paddingBottom: 8 }}>
                          <div style=${{ fontSize: 13, fontWeight: 600, wordBreak: 'break-word', lineHeight: 1.35 }}>${getMenuName(mId)}</div>
                          <div style=${{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 8, fontSize: 12 }}>
                            <span>Titip: <b>${qty}</b></span>
                            <div style=${{ display: 'flex', alignItems: 'center', gap: 6 }}>
                              <span>Sisa:</span>
                              <input
                                type="number"
                                class="input-field"
                                style=${{ width: 64, padding: '4px 6px', textAlign: 'center', height: 30 }}
                                min="0"
                                max=${qty}
                                value=${ambilSisa[mId] ?? 0}
                                onInput=${e => setAmbilSisa({ ...ambilSisa, [mId]: e.target.value })}
                              />
                            </div>
                            <span style=${{ color: 'var(--success)', fontWeight: 700 }}>Laku: ${lakuVal}</span>
                          </div>
                        </div>
                      `;
                    })}
                  </div>

                  <!-- Konfirmasi Pembayaran ke Supplier -->
                  <div style=${{ padding: 12, borderRadius: 10, border: '1px solid var(--border)', background: 'var(--paper2)' }}>
                    <div style=${{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 8 }}>
                      <span style=${{ fontSize: 12, fontWeight: 700 }}>Status Pembayaran ke Mitra:</span>
                      <span style=${{ fontSize: 14, fontWeight: 700, color: 'var(--success)' }}>Rp ${formatRp(previewBersih)}</span>
                    </div>
                    <div style=${{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: 6 }}>
                      ${[
                        [0, 'Belum Dibayar'],
                        [1, 'Lunas Tunai'],
                        [2, 'Lunas Transfer']
                      ].map(([code, label]) => html`
                        <button
                          type="button"
                          class=${Number(ambilBayarCode) === code ? 'btn-primary' : 'btn-ghost'}
                          style=${{ padding: '7px 6px', fontSize: 11.5, background: Number(ambilBayarCode) === code ? (code === 0 ? 'var(--warn)' : 'var(--success)') : 'var(--card)', borderColor: Number(ambilBayarCode) === code ? 'transparent' : 'var(--border)' }}
                          onClick=${() => setAmbilBayarCode(code)}
                        >
                          ${label}
                        </button>
                      `)}
                    </div>
                  </div>

                  <div style=${{ display: 'grid', gridTemplateColumns: '1fr 1.3fr', gap: 8 }}>
                    <button type="button" class="btn-ghost" onClick=${() => saveAmbil(false)}>Simpan Saja</button>
                    <button type="button" class="btn-primary" style=${{ background: 'var(--ink)', borderColor: 'var(--ink)' }} onClick=${() => saveAmbil(true)}>
                      <${I.Printer} style=${{ width: 15, height: 15 }} /> Simpan & Cetak Struk
                    </button>
                  </div>
                </div>
              </div>
            </div>
          `;
        })()}

        <!-- ================================================================
             MODAL 5: LIHAT RINCIAN PENJUALAN TANPA CETAK + VERIFIKASI BAYAR
             ================================================================ -->
        ${modal === 'rincian' && activeRincianTrx && (() => {
          const trx = activeRincianTrx;
          const supObj = getSupplier(trx[2]);
          const sum = calcTrxSummary(trx);
          const isAmbil = trx[3] === 1;
          const bayarCode = Number(trx[4]) || 0;
          const locked = trx[1] < minActiveDate;

          const waText = [
            `Halo ${supObj ? supObj[1] : getSupplierName(trx[2])}, berikut rekap TitipBekal (${trx[1]}):`,
            ...(trx[5] || []).map(([mId, qty, sisa]) => `- ${getMenuName(mId)}: Titip ${qty}, Sisa ${sisa}, Laku ${Math.max(0, qty - sisa)}`),
            `Total Laku: ${sum.totalLaku} pcs`,
            `Hak Bersih: Rp ${formatRp(sum.bersih)}`,
            `Status: ${bayarLabel(bayarCode)}`
          ].join('\n');

          return html`
            <div class="modal-overlay" onClick=${e => e.target === e.currentTarget && setModal(null)}>
              <div class="modal-box anim-up">
                <div style=${{ padding: '14px 18px', borderBottom: '1px solid var(--border)', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                  <div>
                    <h3 style=${{ fontSize: 16, fontWeight: 700, margin: 0 }}>Rincian Transaksi</h3>
                    <div style=${{ fontSize: 11, color: 'var(--muted)' }}>${trx[0]} • ${trx[1]}</div>
                  </div>
                  <button class="btn-ghost" style=${{ padding: 4, border: 'none' }} onClick=${() => setModal(null)}><${I.X} style=${{ width: 19, height: 19 }} /></button>
                </div>

                <div style=${{ padding: 18, display: 'flex', flexDirection: 'column', gap: 14 }}>
                  <div style=${{ padding: 12, borderRadius: 10, background: 'var(--paper2)', display: 'flex', justifyContent: 'space-between', alignItems: 'center', gap: 8 }}>
                    <div>
                      <div style=${{ fontSize: 14, fontWeight: 700 }}>${supObj ? supObj[1] : getSupplierName(trx[2])}</div>
                      <div style=${{ fontSize: 12, color: 'var(--muted)' }}>
                        ${supObj && (supObj[3] || supObj[4]) ? `${supObj[3]} • ${supObj[4]}` : 'Rekening belum diatur'}
                      </div>
                    </div>
                    <div style=${{ display: 'flex', gap: 6 }}>
                      ${supObj && supObj[4] && html`
                        <button class="btn-ghost" style=${{ padding: '6px 9px', fontSize: 11.5 }} onClick=${() => copyToClipboard(supObj[4]).then(() => notify('Nomor rekening disalin'))}>
                          <${I.Copy} style=${{ width: 14, height: 14 }} /> Rek
                        </button>
                      `}
                      ${supObj && supObj[2] && html`
                        <a href=${`https://wa.me/${formatWA(supObj[2])}?text=${encodeURIComponent(waText)}`} target="_blank" class="btn-ghost" style=${{ padding: '6px 9px', fontSize: 11.5, color: 'var(--success)' }}>
                          <${I.MessageCircle} style=${{ width: 14, height: 14 }} /> Kirim WA
                        </a>
                      `}
                    </div>
                  </div>

                  <!-- Rincian Item -->
                  <div style=${{ display: 'flex', flexDirection: 'column', gap: 8, maxHeight: '30vh', overflowY: 'auto' }}>
                    ${(trx[5] || []).map(([mId, qty, sisa]) => {
                      const laku = Math.max(0, qty - sisa);
                      return html`
                        <div key=${mId} style=${{ padding: 9, borderRadius: 8, border: '1px solid var(--border)', display: 'flex', justifyContent: 'space-between', alignItems: 'center', gap: 8 }}>
                          <div style=${{ flex: 1, minWidth: 0, fontSize: 13, fontWeight: 600, wordBreak: 'break-word' }}>${getMenuName(mId)}</div>
                          <div style=${{ fontSize: 12, textAlign: 'right', flexShrink: 0 }}>
                            <div>Ttp: <b>${qty}</b> | Sisa: <b>${sisa}</b></div>
                            <div style=${{ color: 'var(--success)', fontWeight: 700 }}>Laku: ${laku} pcs</div>
                          </div>
                        </div>
                      `;
                    })}
                  </div>

                  <!-- Ringkasan Rupiah -->
                  <div style=${{ padding: 12, borderRadius: 10, background: 'var(--paper2)', fontSize: 13, display: 'flex', flexDirection: 'column', gap: 5 }}>
                    <div style=${{ display: 'flex', justifyContent: 'space-between' }}><span>Total Laku (@Rp ${formatRp(sum.hargaJual)}):</span><b>${sum.totalLaku} pcs</b></div>
                    <div style=${{ display: 'flex', justifyContent: 'space-between' }}><span>Penjualan Bruto:</span><span>Rp ${formatRp(sum.bruto)}</span></div>
                    <div style=${{ display: 'flex', justifyContent: 'space-between' }}><span>Komisi Lapak (@Rp ${formatRp(sum.komisi)}):</span><span>-Rp ${formatRp(sum.potKomisi)}</span></div>
                    <div style=${{ borderTop: '1px dashed var(--border)', paddingTop: 6, display: 'flex', justifyContent: 'space-between', fontSize: 15, fontWeight: 700, color: 'var(--success)' }}>
                      <span>Hak Bersih Supplier:</span>
                      <span>Rp ${formatRp(sum.bersih)}</span>
                    </div>
                  </div>

                  <!-- Verifikasi Pembayaran Langsung dari Rincian -->
                  ${isAmbil && !locked && html`
                    <div>
                      <div style=${{ fontSize: 12, fontWeight: 700, marginBottom: 6 }}>Verifikasi Status Pembayaran Supplier:</div>
                      <div style=${{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: 6 }}>
                        ${[[0, 'Belum Dibayar'], [1, 'Lunas Tunai'], [2, 'Lunas Transfer']].map(([c, lbl]) => html`
                          <button
                            type="button"
                            class=${bayarCode === c ? 'btn-primary' : 'btn-ghost'}
                            style=${{ padding: '7px 6px', fontSize: 11.5, background: bayarCode === c ? (c === 0 ? 'var(--warn)' : 'var(--success)') : 'transparent', borderColor: bayarCode === c ? 'transparent' : 'var(--border)' }}
                            onClick=${() => updatePaymentStatusOnly(trx, c)}
                          >
                            ${lbl}
                          </button>
                        `)}
                      </div>
                    </div>
                  `}

                  <div style=${{ display: 'flex', justifyContent: 'space-between', gap: 8, marginTop: 4 }}>
                    ${!locked ? html`
                      <button type="button" class="btn-ghost" style=${{ color: 'var(--expense)' }} onClick=${() => hapusTransaksi(trx)}>
                        <${I.Trash} style=${{ width: 15, height: 15 }} /> Hapus Nota
                      </button>
                    ` : html`<div></div>`}
                    <div style=${{ display: 'flex', gap: 8 }}>
                      <button type="button" class="btn-ghost" onClick=${() => executePrint({ type: isAmbil ? 'ambil' : 'titip', trx })}>
                        <${I.Printer} style=${{ width: 15, height: 15 }} /> Cetak Struk
                      </button>
                      <button type="button" class="btn-primary" onClick=${() => setModal(null)}>Tutup</button>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          `;
        })()}

        <!-- ================================================================
             MODAL 6: GENERATOR DAFTAR MENU HARIAN -> TEKS RAPI PER KATEGORI (CANVA)
             ================================================================ -->
        ${modal === 'harian' && html`
          <div class="modal-overlay" onClick=${e => e.target === e.currentTarget && setModal(null)}>
            <div class="modal-box anim-up">
              <div style=${{ padding: '14px 18px', borderBottom: '1px solid var(--border)', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                <div>
                  <h3 style=${{ fontSize: 16, fontWeight: 700, margin: 0 }}>Teks Daftar Menu Harian (Siap Canva)</h3>
                  <div style=${{ fontSize: 11, color: 'var(--muted)' }}>Terurut rapi per kategori untuk ditempel ke desain Canva</div>
                </div>
                <button class="btn-ghost" style=${{ padding: 4, border: 'none' }} onClick=${() => setModal(null)}><${I.X} style=${{ width: 19, height: 19 }} /></button>
              </div>

              <div style=${{ padding: 18, display: 'flex', flexDirection: 'column', gap: 12 }}>
                <div style=${{ display: 'flex', gap: 8, alignItems: 'center' }}>
                  <input type="date" class="input-field" style=${{ width: 'auto' }} value=${harianDate} onInput=${e => setHarianDate(e.target.value || todayStr)} />
                  <button type="button" class="btn-primary" style=${{ flex: 1, fontSize: 12 }} onClick=${() => autoSelectFromDate(harianDate)}>
                    Ambil dari Titipan Tanggal Ini
                  </button>
                </div>

                <div style=${{ display: 'flex', gap: 6 }}>
                  <input type="text" class="input-field" style=${{ height: 34, fontSize: 12.5 }} placeholder="Cari & centang menu..." value=${harianSearch} onInput=${e => setHarianSearch(e.target.value)} />
                  <button type="button" class="btn-ghost" style=${{ padding: '4px 9px', fontSize: 11.5, whiteSpace: 'nowrap' }} onClick=${() => {
                    const next = {};
                    db.mnu.forEach(m => { next[m[0]] = true; });
                    setHarianSelected(next);
                  }}>Semua</button>
                  <button type="button" class="btn-ghost" style=${{ padding: '4px 9px', fontSize: 11.5 }} onClick=${() => setHarianSelected({})}>Reset</button>
                </div>

                <div style=${{ background: 'var(--paper2)', padding: 10, borderRadius: 8, border: '1px solid var(--border)', display: 'flex', flexDirection: 'column', gap: 6, maxHeight: '24vh', overflowY: 'auto' }}>
                  ${filteredHarianMenus.map(m => html`
                    <label key=${m[0]} style=${{ display: 'flex', alignItems: 'flex-start', gap: 8, cursor: 'pointer', fontSize: 13 }}>
                      <input type="checkbox" style=${{ width: 16, height: 16, marginTop: 2, accentColor: 'var(--accent)', flexShrink: 0 }} checked=${!!harianSelected[m[0]]} onChange=${e => setHarianSelected({ ...harianSelected, [m[0]]: e.target.checked })} />
                      <span style=${{ flex: 1, wordBreak: 'break-word' }}><b>${m[2]}</b> <span style=${{ fontSize: 11, color: 'var(--muted)' }}>• ${m[3]}</span></span>
                    </label>
                  `)}
                </div>

                <!-- Opsi Format Teks Canva -->
                <div style=${{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', gap: 8, flexWrap: 'wrap', fontSize: 12 }}>
                  <label style=${{ display: 'flex', alignItems: 'center', gap: 6, cursor: 'pointer' }}>
                    <input type="checkbox" checked=${harianIncludeHeader} onChange=${e => setHarianIncludeHeader(e.target.checked)} />
                    <span>Sertakan Judul & Tanggal</span>
                  </label>
                  <div style=${{ display: 'flex', gap: 4 }}>
                    ${[['• ', '• Bullet'], ['- ', '- Strip'], ['', 'Polos']].map(([sym, lbl]) => html`
                      <button type="button" class=${harianBullet === sym ? 'btn-primary' : 'btn-ghost'} style=${{ padding: '3px 8px', fontSize: 11 }} onClick=${() => setHarianBullet(sym)}>${lbl}</button>
                    `)}
                  </div>
                </div>

                <textarea
                  class="input-field"
                  rows="8"
                  style=${{ fontFamily: 'DM Sans, sans-serif', fontSize: 13, lineHeight: 1.45 }}
                  placeholder="Pilih menu di atas untuk menghasilkan daftar teks terurut per kategori..."
                  value=${canvaMenuText}
                />

                <button
                  type="button"
                  class="btn-primary"
                  disabled=${!canvaMenuText}
                  onClick=${() => copyToClipboard(canvaMenuText).then(() => notify('Daftar menu disalin! Siap ditempel ke Canva'))}
                >
                  <${I.Copy} style=${{ width: 16, height: 16 }} /> Salin Teks Menu (${Object.values(harianSelected).filter(Boolean).length} menu)
                </button>
              </div>
            </div>
          </div>
        `}

        <!-- ================================================================
             MODAL 7: REKAP PENJUALAN PDF & CSV (PER HARI / RENTANG / GLOBAL / SUP / MENU)
             ================================================================ -->
        ${modal === 'rekap' && html`
          <div class="modal-overlay" onClick=${e => e.target === e.currentTarget && setModal(null)}>
            <div class="modal-box anim-up" style=${{ maxWidth: 580 }}>
              <div style=${{ padding: '14px 18px', borderBottom: '1px solid var(--border)', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                <h3 style=${{ fontSize: 16, fontWeight: 700, margin: 0 }}>Rekap Penjualan (PDF & CSV)</h3>
                <button class="btn-ghost" style=${{ padding: 4, border: 'none' }} onClick=${() => setModal(null)}><${I.X} style=${{ width: 19, height: 19 }} /></button>
              </div>

              <div style=${{ padding: 18, display: 'flex', flexDirection: 'column', gap: 12 }}>
                <div class="tab-bar">
                  <button class=${'tab-btn ' + (rekapPeriodType === 'single' ? 'active' : '')} onClick=${() => setRekapPeriodType('single')}>Per Hari (1 Tanggal)</button>
                  <button class=${'tab-btn ' + (rekapPeriodType === 'range' ? 'active' : '')} onClick=${() => setRekapPeriodType('range')}>Rentang Tanggal</button>
                </div>

                <div style=${{ display: 'grid', gridTemplateColumns: rekapPeriodType === 'range' ? '1fr 1fr' : '1fr', gap: 8 }}>
                  <div>
                    <label style=${{ fontSize: 11, fontWeight: 600, color: 'var(--muted)' }}>${rekapPeriodType === 'range' ? 'Dari Tanggal' : 'Pilih Tanggal'}</label>
                    <input type="date" class="input-field" value=${rekapFrom} onInput=${e => setRekapFrom(e.target.value || todayStr)} />
                  </div>
                  ${rekapPeriodType === 'range' && html`
                    <div>
                      <label style=${{ fontSize: 11, fontWeight: 600, color: 'var(--muted)' }}>Sampai Tanggal</label>
                      <input type="date" class="input-field" value=${rekapTo} onInput=${e => setRekapTo(e.target.value || rekapFrom)} />
                    </div>
                  `}
                </div>

                <div style=${{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: 6 }}>
                  ${[
                    ['global', 'Global (Nota)'],
                    ['supplier', 'Per Supplier'],
                    ['menu', 'Per Menu']
                  ].map(([mKey, mLbl]) => html`
                    <button type="button" class=${rekapGroupMode === mKey ? 'btn-primary' : 'btn-ghost'} style=${{ padding: '7px 8px', fontSize: 12 }} onClick=${() => setRekapGroupMode(mKey)}>
                      ${mLbl}
                    </button>
                  `)}
                </div>

                <label style=${{ display: 'flex', alignItems: 'center', gap: 6, fontSize: 12, cursor: 'pointer' }}>
                  <input type="checkbox" checked=${rekapOnlyAmbil} onChange=${e => setRekapOnlyAmbil(e.target.checked)} />
                  <span>Hanya hitung nota yang sudah diproses ambil</span>
                </label>

                <!-- Ringkasan & Preview Tabel -->
                <div style=${{ padding: 10, borderRadius: 10, background: 'var(--paper2)', border: '1px solid var(--border)' }}>
                  ${isLoadingHist ? html`
                    <div style=${{ fontSize: 12.5, textAlign: 'center', padding: 16, color: 'var(--muted)' }}>Menarik data historis dari Cloud...</div>
                  ` : html`
                    <div style=${{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: 6, textAlign: 'center', marginBottom: 8 }}>
                      <div style=${{ background: 'var(--card)', padding: 6, borderRadius: 6 }}>
                        <div style=${{ fontSize: 10, color: 'var(--muted)' }}>Terjual</div>
                        <div style=${{ fontSize: 13, fontWeight: 700 }}>${rekapComputed.totals.laku} / ${rekapComputed.totals.titip}</div>
                      </div>
                      <div style=${{ background: 'var(--card)', padding: 6, borderRadius: 6 }}>
                        <div style=${{ fontSize: 10, color: 'var(--muted)' }}>Komisi Lapak</div>
                        <div style=${{ fontSize: 13, fontWeight: 700, color: 'var(--info)' }}>Rp ${formatRp(rekapComputed.totals.komisi)}</div>
                      </div>
                      <div style=${{ background: 'var(--card)', padding: 6, borderRadius: 6 }}>
                        <div style=${{ fontSize: 10, color: 'var(--muted)' }}>Hak Mitra</div>
                        <div style=${{ fontSize: 13, fontWeight: 700, color: 'var(--success)' }}>Rp ${formatRp(rekapComputed.totals.bersih)}</div>
                      </div>
                    </div>

                    <div style=${{ maxHeight: '26vh', overflowY: 'auto', fontSize: 12 }}>
                      ${rekapComputed.rows.length === 0 ? html`
                        <div style=${{ textAlign: 'center', color: 'var(--muted)', padding: 12 }}>Tidak ada data transaksi pada periode ini.</div>
                      ` : rekapComputed.rows.map((r, i) => html`
                        <div key=${i} style=${{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', padding: '6px 4px', borderBottom: '1px solid var(--border)', gap: 8 }}>
                          <div style=${{ flex: 1, minWidth: 0 }}>
                            <div style=${{ fontWeight: 600, wordBreak: 'break-word' }}>
                              ${rekapGroupMode === 'menu' ? r.menu : r.supplier}
                            </div>
                            <div style=${{ fontSize: 11, color: 'var(--muted)' }}>
                              ${rekapGroupMode === 'global' ? `${r.tanggal} • ${r.statusText}` : rekapGroupMode === 'supplier' ? `${r.nota} nota • Ttp ${r.titip}` : `${r.supplier} • Ttp ${r.titip}`}
                            </div>
                          </div>
                          <div style=${{ textAlign: 'right', flexShrink: 0 }}>
                            <div style=${{ fontWeight: 700 }}>Laku: ${r.laku}</div>
                            <div style=${{ fontSize: 11, color: 'var(--success)' }}>Rp ${formatRp(r.bersih)}</div>
                          </div>
                        </div>
                      `)}
                    </div>
                  `}
                </div>

                <div style=${{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 10 }}>
                  <button type="button" class="btn-ghost" onClick=${exportRekapCSV}>
                    <${I.Download} style=${{ width: 16, height: 16 }} /> Export CSV
                  </button>
                  <button type="button" class="btn-primary" onClick=${printRekapPDF}>
                    <${I.Printer} style=${{ width: 16, height: 16 }} /> Cetak / Simpan PDF
                  </button>
                </div>
              </div>
            </div>
          </div>
        `}

        <!-- ================================================================
             MODAL 8: SCANNER QR CODE STRUK
             ================================================================ -->
        ${modal === 'scan' && html`
          <div class="modal-overlay" onClick=${e => e.target === e.currentTarget && setModal(null)}>
            <div class="modal-box anim-up">
              <div style=${{ padding: '14px 18px', borderBottom: '1px solid var(--border)', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                <h3 style=${{ fontSize: 16, fontWeight: 700, margin: 0 }}>Scan QR Code Struk Titip</h3>
                <button class="btn-ghost" style=${{ padding: 4, border: 'none' }} onClick=${() => setModal(null)}><${I.X} style=${{ width: 19, height: 19 }} /></button>
              </div>
              <div style=${{ padding: 18 }}>
                <p style=${{ fontSize: 12.5, color: 'var(--muted)', margin: '0 0 10px 0', textAlign: 'center' }}>
                  Arahkan kamera ke QR Code pada struk penitipan untuk memproses pengambilan & pembayaran.
                </p>
                <div id="qr-reader" style=${{ width: '100%', minHeight: 240, background: '#000', borderRadius: 8 }}></div>
              </div>
            </div>
          </div>
        `}

        ${toast && html`<${Toast} msg=${toast.msg} type=${toast.type} />`}
      </div>

      <!-- AREA KHUSUS CETAK (THERMAL 57mm & A4 PDF) -->
      <div class="print-only">
        <${PrintOverlay}
          printData=${printData}
          bizInfo=${db.set.bizInfo}
          logoUrl=${localLogo}
          getSupplierName=${getSupplierName}
          getMenuName=${getMenuName}
        />
      </div>
    </div>
  `;
}

render(html`<${App} />`, document.getElementById('app-root'));
</script>
</body>
</html>
